[pytest]
testpaths = tests
pythonpath =
    src
    .
markers =
    requires_clip_tokenizer: needs the pinned SD1.4 CLIP tokenizer in the Hugging Face cache
    requires_gemma_tokenizer: needs the pinned Sana Gemma tokenizer in the Hugging Face cache
    requires_holccg: needs the holccg package
    requires_spacy_model: needs the spaCy model en_core_web_sm 3.8.0
